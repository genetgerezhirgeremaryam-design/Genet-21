<title>Genet 21</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5b6374;--ac:#0a7d4f;--bd:#d9dde7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--card:#1b2030;--tx:#eef0f6;--mu:#a3abbd;--ac:#2fbf80;--bd:#33394d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Ethiopic","Nyala",sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
.logo{display:block;width:100%;max-width:100%;height:auto;margin:0 auto 8px;border-radius:12px}.sub{text-align:center}
.sub{color:var(--mu);font-size:14px;margin:4px 0 12px}
select,input,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px}
button{background:var(--ac);color:#fff;border:0;font-weight:700;margin-top:18px;cursor:pointer}
#pv{max-width:160px;border-radius:10px;margin-top:8px;display:none}.hid{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.pick{display:block;text-align:center;padding:14px;border:2px dashed var(--ac);border-radius:10px;color:var(--ac);font-weight:700;cursor:pointer}
.lk a{display:block;padding:10px 0;color:var(--ac);word-break:break-all;border-bottom:1px solid var(--bd);text-decoration:none}
.note{font-size:12px;color:var(--mu);margin-top:6px}
</style>
